<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Rota Segura - Paz no Trânsito.</title>
    <!-- Configurações básicas de PWA para Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Rota Segura">
    <style>
        :root {
            --primary: #e67e22;          /* Triângulo de risco em Laranja */
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --success: #2ecc71;
            --gray: #bdc3c7;
            --android-green: #27ae60;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eeda8a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container simulando um smartphone */
        .app-container {
            width: 100%;
            max-width: 410px;
            height: 90vh;
            background-color: var(--light);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 8px solid var(--dark);
            position: relative;
        }

        /* Cabeçalho com Logo Integrada */
        header {
            background-color: var(--dark);
            color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 5px solid var(--primary);
        }

        .logo-container {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            padding: 2px;
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-header {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-text h1 {
            font-size: 1.1rem;
            line-height: 1.1;
        }

        .header-text p {
            font-size: 0.7rem;
            color: #bdc3c7;
        }

        /* Box do Banner / Imagem Centralizada na Inicial */
        .banner-container {
            width: 100%;
            height: 200px;
            background-color: #eeda8a;
            border-bottom: 3px solid var(--primary);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-banner {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fff;
        }

        /* Área de conteúdo rolável */
        .content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: var(--light);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
        }

        .card h2 {
            font-size: 1rem;
            color: var(--dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card p, .card li {
            font-size: 0.8rem;
            color: #555;
            line-height: 1.4;
        }

        /* Pequeno triângulo inline para títulos e blocos */
        .mini-triangle {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid var(--primary);
            display: inline-block;
        }

        /* Seção do Botão Triangular de Alerta Extremo */
        .alert-trigger-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            text-align: center;
        }

        /* Botão Triangular Laranja */
        .triangle-btn-container {
            position: relative;
            width: 90px;
            height: 80px;
            cursor: pointer;
            margin-bottom: 5px;
            transition: transform 0.2s;
        }

        .triangle-btn-container:active {
            transform: scale(0.95);
        }

        .triangle-shape {
            width: 0;
            height: 0;
            border-left: 45px solid transparent;
            border-right: 45px solid transparent;
            border-bottom: 78px solid var(--primary);
            position: absolute;
            top: 0; left: 0;
        }

        .triangle-icon {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translate(-50%, 0);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
        }

        .triangle-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--dark);
            margin-top: 5px;
        }

        /* Formulários e Quiz */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--dark);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.8rem;
            outline: none;
            background-color: white;
        }

        .quiz-option {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f2f6;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .quiz-option input {
            margin-right: 5px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-danger { background: var(--danger); color: white; }
        .btn-primary { background: var(--dark); color: white; margin-top: 10px; }

        /* Lista de Flagrantes Cadastrados Dinamicamente */
        .flagrantes-list {
            margin-top: 10px;
            max-height: 180px;
            overflow-y: auto;
        }

        .flagrante-item {
            background: #f1f2f6;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--primary);
            font-size: 0.75rem;
        }

        /* 🎥 Espaço de Vídeos de Conscientização */
        .video-placeholder {
            width: 100%;
            height: 160px;
            background-color: #000;
            border-radius: 8px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            position: relative;
        }

        .video-placeholder span {
            font-size: 1.1rem;
            opacity: 0.7;
            cursor: pointer;
        }

        .activity-badge {
            background-color: var(--dark);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 5px;
        }

        /* Rodapé */
        footer {
            background: #fff;
            padding: 10px 0;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #eee;
            z-index: 10;
        }

        .tab-button {
            background: none;
            border: none;
            font-size: 0.7rem;
            color: var(--gray);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 25%;
        }

        .tab-button.active {
            color: var(--dark);
            font-weight: bold;
        }

        .tab-button span { font-size: 1.1rem; }
    </style>
</head>
<body>

        <!-- Cabeçalho -->
        <header>
            <div class="logo-container">
                <!-- 🌐 Caminho absoluto da logo corrigido -->
                <img class="logo-header" src="/home/adevan12/Documentos/Aplicativo HTML%3ECSSpaz no transito/LOGO PAZ NO TRANSITO Se  liga no fluxo.png" alt="Se Liga no Fluxo">
            </div>
            <div class="header-text">
                <h1>Rota Segura</h1>
                <p>Análise de Riscos Viários</p>
            </div>
        </header>

        <!-- Área de conteúdo rolável -->
        <div class="content">
            
            <!-- ABA 1: INÍCIO (Apresentação do Projeto Acadêmico) -->
            <div id="tab-inicio" class="tab-content active">
                <div class="banner-container">
