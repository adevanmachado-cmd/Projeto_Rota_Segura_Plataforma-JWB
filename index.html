<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rota Segura</title>
    <meta http-equiv="refresh" content="0; url=./PAz%20no%20Tr%C3%A2nsito.index.html" />
    <style>
      :root {
        --bg: #f4f7fb;
        --text: #1f2937;
        --card: #ffffff;
        --primary: #2563eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family: Arial, sans-serif;
        color: var(--text);
      }
      .card {
        background: var(--card);
        padding: 2rem 2.5rem;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.5rem, 2vw, 2.5rem);
      }
      p { margin: 0; }
      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Carregando Rota Segura...</h1>
      <p>
        Se a página não abrir automaticamente,
        <a href="./PAz%20no%20Tr%C3%A2nsito.index.html">clique aqui</a>.
      </p>
    </div>
  </body>
</html>
